server:
  port: 8082

spring:
  application:
    name: trainer-workload-service

  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:trainer_workload_db}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      auto-index-creation: true

  activemq:
    broker-url: vm://localhost?broker.persistent=false

activemq:
  queues:
    trainer-workload: trainer.workload.queue

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.gym.crm.workload: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId:-NO-TX}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId:-NO-TX}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trainer-workload-service.log