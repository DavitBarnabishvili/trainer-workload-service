spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: test_trainer_workload_db

  activemq:
    broker-url: vm://localhost?broker.persistent=false

activemq:
  queues:
    trainer-workload: test.trainer.workload.queue

eureka:
  client:
    enabled: false

logging:
  level:
    com.gym.crm.workload: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId:-NO-TX}] [%thread] %-5level %logger{36} - %msg%n"