spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgresSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

  activemq:
    broker-url: vm://localhost?broker.persistent=false
    in-memory: true

activemq:
  queues:
    trainer-workload: test.trainer.workload.queue

eureka:
  client:
    enabled: false

logging:
  level:
    com.gym.crm.workload: DEBUG