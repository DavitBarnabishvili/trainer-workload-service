server:
  port: 0

spring:
  application:
    name: trainer-workload-service-test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

  activemq:
    broker-url: vm://localhost?broker.persistent=false&broker.useJmx=false&broker.schedulerSupport=false
    packages:
      trust-all: true
    listener:
      acknowledge-mode: auto
  jms:
    listener:
      acknowledge-mode: auto

activemq:
  queues:
    trainer-workload: test.trainer.workload.queue

eureka:
  client:
    enabled: false

logging:
  level:
    com.gym.crm.workload: DEBUG
    org.springframework.jms: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId:-NO-TX}] [%thread] %-5level %logger{36} - %msg%n"